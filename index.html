<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amjilt Canteen — Сургуулийн хоолны шинэ үе</title>
<meta name="description" content="Amjilt Canteen — Амжилт Smart Queue, QR Pickup, Wallet, Food Waste Meter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230E6B4F'/><path d='M8 20h16a8 8 0 0 1-16 0Z' fill='%23fff'/><path d='M13 12c0-2 1.4-2.4 1.4-4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>

<div class="stage">
  <!-- ============ LEFT RAIL: screen index ============ -->
  <aside class="rail">
    <div class="rail-brand">
      <span class="rail-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18a9 9 0 0 1-9 9 9 9 0 0 1-9-9Z"/><path d="M8 6c0-1.5 1-2 1-3.2"/><path d="M13 6c0-2 1.3-2.6 1.3-4.2"/></svg></span>
      <span>
        <b>Amjilt Canteen</b>
        <span>Сургуулийн хоолны шинэ үе</span>
      </span>
    </div>
    <nav id="rail"></nav>
  </aside>

  <!-- ============ RIGHT: live viewport ============ -->
  <main class="view">
    <div class="view-bar">
      <div class="name">
        <span id="screenName">Нүүр</span>
        <em id="screenNote"></em>
      </div>
      <div class="flowbar">
        <button onclick="flowStart()">▶ Prototype flow</button>
        <button onclick="resetAll()">↺ Reset</button>
      </div>
    </div>
    <div id="stage"></div>
    <p style="margin-top:22px;max-width:390px;font:500 12px/1.6 var(--font);color:var(--text-tertiary)">
      Бүх дэлгэц дээрх <b style="color:var(--text-secondary)">▶ Prototype flow</b> товч
      дарвал бүх хувилбарыг тогтмол дарааллаар үзүүлнэ. Сурагчийн гол урсгал:
      Нүүр → Хоолны дэлгэрэнгүй → Сагс → Цагаа сонгох → Төлбөр → QR.
    </p>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/components.js"></script>
<script src="assets/app.js"></script>
<script src="assets/screens-signature.js"></script>
<script src="assets/screens-mobile.js"></script>
<script src="assets/screens-dash.js"></script>
</body>
</html>
