<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дөрвөн бүтээгдэхүүн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6;--surf:#fff;--sunken:#F3F1EC;--line:#E6E3DC;--line2:#D5D1C7;
  --t1:#1A1D1C;--t2:#5C6563;--t3:#8E9795;--ok:#12855F;--bad:#D0342C;--warn:#E8A317;
  --f:"Nunito",system-ui,sans-serif;
  /* per-idea accents, swapped per slide */
  --a:#0E6B4F;--a2:#6BD4AE;--a3:#052E22;--aw:#EEFBF5;--aw2:#A9E9D0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:500 16px/1.5 var(--f);color:var(--t1);background:#151A1D;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
  transform-origin:center center;transform:translate(-50%,-50%)}
.slide{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;
  padding:74px 96px;overflow:hidden}
.slide.on{display:flex}
.slide.dark{background:
  radial-gradient(1100px 700px at 16% -10%,color-mix(in srgb,var(--a2) 22%,transparent),transparent 62%),
  linear-gradient(155deg,var(--a3),color-mix(in srgb,var(--a3) 88%,#000));
  color:#fff}

.bar{position:absolute;left:0;right:0;bottom:30px;display:flex;align-items:center;
  justify-content:space-between;padding:0 96px;font:700 13px/1 var(--f);color:var(--t3)}
.dark .bar{color:rgba(255,255,255,.45)}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:7px;background:var(--line2);cursor:pointer;transition:.2s}
.slide.on .dots i.cur{width:26px;background:var(--a)}
.dark .slide.on .dots i.cur{background:var(--a2)}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99;
  font:600 12px/1 var(--f);color:rgba(255,255,255,.32);pointer-events:none;transition:opacity .4s}
body.hide .hint{opacity:0}

h1.big{font:800 76px/1.05 var(--f);letter-spacing:-2.6px}
h2.big{font:800 54px/1.08 var(--f);letter-spacing:-1.8px}
h3.big{font:800 32px/1.15 var(--f);letter-spacing:-.9px}
.lede{font:500 21px/1.55 var(--f);color:var(--t2);max-width:66ch}
.dark .lede{color:rgba(255,255,255,.72)}
.eyebrow{font:800 13px/1 var(--f);letter-spacing:2.4px;color:var(--a);margin-bottom:20px}
.dark .eyebrow{color:var(--a2)}
.cap{font:700 12px/1 var(--f);letter-spacing:1.4px;color:var(--t3);text-transform:uppercase}
.mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(160deg,var(--a),var(--a3));
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.18);font-size:26px}

.panel{background:var(--surf);border-radius:22px;padding:26px;box-shadow:0 1px 3px rgba(26,29,28,.05)}
.pt{font:800 18px/1.25 var(--f);letter-spacing:-.2px}
.ps{font:500 13px/1.4 var(--f);color:var(--t2);margin-top:4px}
.stat{background:var(--surf);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(26,29,28,.05)}
.stat .k{font:700 11px/1 var(--f);letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.stat .v{font:800 42px/1 var(--f);letter-spacing:-1.6px;margin-top:10px}
.stat .d{font:500 13px/1.4 var(--f);color:var(--t2);margin-top:7px}
.tiles{display:grid;gap:18px}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.badge{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;
  background:var(--aw);color:var(--a);font:800 13px/1 var(--f)}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;
  background:var(--sunken);color:var(--t2);font:700 12px/1 var(--f)}
.two{display:grid;grid-template-columns:1fr auto;gap:64px;align-items:center;flex:1}
.two-r{display:grid;grid-template-columns:auto 1fr;gap:64px;align-items:center;flex:1}
.list{display:flex;flex-direction:column;gap:11px}
.row-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;
  background:var(--surf);box-shadow:inset 0 0 0 1.5px var(--line)}
.row-item i{width:8px;height:8px;border-radius:50%;background:var(--a);flex:none;margin-top:7px}
.row-item b{font:800 15px/1.3 var(--f)}
.row-item p{font:500 13px/1.4 var(--f);color:var(--t2);margin-top:3px}

/* idea rail */
.rail{position:absolute;left:96px;top:74px;display:flex;gap:10px}
.rail b{height:34px;padding:0 15px;border-radius:999px;display:inline-flex;align-items:center;
  font:800 13px/1 var(--f);background:var(--sunken);color:var(--t3)}
.rail b.on{background:var(--a);color:#fff}
</style>
</head>
<body>

  color:#8E201B;font:600 13px/1.5 monospace;padding:12px;display:none;white-space:pre-wrap"></div>

      align-self:flex-end">${rank}</div></div>`;
}

var names=['Нүүр','VR хяналт','VR бэлэн','МЭВИ','МЭВИ тоо','Дуу','Дуу бэрхүү',
           'Карт','Карт борлуулалт','Хаалт'];
var stage=document.getElementById('stage');
stage.innerHTML=S.map(function(s,i){
  var v=s.a;  /* set the per-slide accent from the palette object */
  return '<section class="slide '+s.cls+'" data-i="'+i+'" style="--a:'+v.a+';--a2:'+v.a2+
   ';--a3:'+v.a3+';--aw:'+v.aw+';--aw2:'+v.aw2+'">'+s.inner+
   '<div class="bar"><span>'+names[i]+'</span><span class="dots">'+
   S.map(function(_,j){return '<i data-j="'+j+'" class="'+(j===i?'cur':'')+'"></i>';}).join('')+
   '</span><span>'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+
   '</span></div></section>';}).join('');

var sl=[].slice.call(document.querySelectorAll('.slide'));
var idx=0;
function show(n){
  idx=Math.max(0,Math.min(S.length-1,n));
  sl.forEach(function(s,j){s.classList.toggle('on',j===idx);});
  [].slice.call(document.querySelectorAll('.dots i')).forEach(function(d,j){
    d.classList.toggle('cur',j===idx);});
  document.body.classList.add('hide');
}
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);
addEventListener('hashchange',function(){
  var n=Math.min(S.length,Math.max(1,+location.hash.slice(1)||1))-1;
  if(n!==idx)show(n);});
addEventListener('keydown',function(e){
  if(['ArrowRight','ArrowDown',' ','PageDown'].indexOf(e.key)>-1){e.preventDefault();show(idx+1);}
  if(['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)>-1){e.preventDefault();show(idx-1);}
  if(e.key==='Home')show(0);
  if(e.key==='End')show(S.length-1);
  if(e.key.toLowerCase()==='f'){document.fullscreenElement?
    document.exitFullscreen():document.documentElement.requestFullscreen();}
});
addEventListener('click',function(e){
  var d=e.target.closest('[data-j]');
  if(d)return show(+d.dataset.j);
  show(e.clientX<innerWidth*0.28?idx-1:idx+1);});
fit();
show(location.hash?Math.min(S.length,Math.max(1,+location.hash.slice(1)||1))-1:0);
</script>
