<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amjilt Canteen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --b900:#052E22;--b800:#07422F;--b700:#0A5540;--b600:#0E6B4F;--b500:#12855F;--b400:#3AA47E;
  --b300:#6BD4AE;--b200:#A9E9D0;--b100:#D6F5E8;--b050:#EEFBF5;
  --a700:#B84A0C;--a600:#E86A16;--a500:#FF7A29;--a300:#FFB781;--a100:#FFEDE1;
  --bg:#FAF9F6;--surf:#fff;--sunken:#F3F1EC;--line:#E6E3DC;--line2:#D5D1C7;
  --t1:#1A1D1C;--t2:#5C6563;--t3:#8E9795;
  --ok:#12855F;--warn:#E8A317;--bad:#D0342C;
  --f:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:500 16px/1.5 var(--f);color:var(--t1);background:#20262B;overflow:hidden;
     -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
       transform-origin:center center;transform:translate(-50%,-50%)}
.slide{position:absolute;inset:0;background:var(--bg);display:none;
       flex-direction:column;padding:76px 96px;overflow:hidden}
.slide.on{display:flex}
.slide.dark{background:
  radial-gradient(1100px 700px at 18% -10%,rgba(107,212,174,.20),transparent 62%),
  linear-gradient(155deg,#07422F,#052E22);color:#fff}

/* ---- chrome ---- */
.bar{position:absolute;left:0;right:0;bottom:30px;display:flex;align-items:center;
     justify-content:space-between;padding:0 96px;font:700 13px/1 var(--f);color:var(--t3)}
.dark .bar{color:rgba(255,255,255,.45)}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:7px;background:var(--line2);cursor:pointer;transition:.2s}
.slide.on .dots i.cur{width:26px;background:var(--b600)}
.dark .slide.on .dots i.cur,.dark .dots i.cur{background:var(--b300)}
.dots i:hover{background:var(--a500)}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99;
      font:600 12px/1 var(--f);color:rgba(255,255,255,.35);pointer-events:none;transition:opacity .4s}
.hide .hint{opacity:0}

/* ---- type ---- */
h1.big{font:800 78px/1.05 var(--f);letter-spacing:-2.6px}
h2.big{font:800 56px/1.08 var(--f);letter-spacing:-1.8px}
h3.big{font:800 34px/1.15 var(--f);letter-spacing:-.9px}
.lede{font:500 21px/1.5 var(--f);color:var(--t2);max-width:64ch}
.dark .lede{color:rgba(255,255,255,.72)}
.eyebrow{font:800 13px/1 var(--f);letter-spacing:2.4px;color:var(--a500);margin-bottom:22px}
.kicker{display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 17px;
        border-radius:999px;background:var(--b050);color:var(--b700);
        font:800 14px/1 var(--f)}
.mono{font-variant-numeric:tabular-nums}
.mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(160deg,var(--b600),var(--b800));
      display:grid;place-items:center;box-shadow:0 8px 22px rgba(14,107,79,.34)}

/* ---- phone ---- */
.phone{width:390px;height:844px;border-radius:46px;border:10px solid #14171A;background:var(--bg);
      overflow:hidden;display:flex;flex-direction:column;flex:none;
      box-shadow:0 30px 70px rgba(10,25,20,.20)}
.sbar{height:42px;display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;font:800 12px/1 var(--f);flex:none}
.pbody{flex:1;padding:6px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.pnav{height:70px;display:grid;grid-template-columns:repeat(5,1fr);flex:none;
      background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.pnav div{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:5px;font:700 10px/1 var(--f);color:var(--t3)}
.pnav div.on{color:var(--b600);font-weight:800}
.pnav i{width:20px;height:20px;border-radius:7px;background:currentColor;opacity:.85}
.pnav i.sm{width:17px;height:17px}
.pnav .pill{width:20px;height:3px;border-radius:3px;background:var(--b300)}

.ttl{font:800 24px/1.2 var(--f);letter-spacing:-.4px}
.sml{font:500 13px/1.4 var(--f);color:var(--t2)}
.lbl{font:700 11px/1 var(--f);letter-spacing:.4px;color:var(--t3)}
.money{font:800 26px/1 var(--f);letter-spacing:-.5px}

/* wallet card */
.wc{border-radius:22px;padding:20px;color:#fff;
    background:radial-gradient(120% 100% at 85% 0%,rgba(107,212,174,.35),transparent 55%),
               linear-gradient(150deg,var(--b700),var(--b900));
    box-shadow:0 10px 26px rgba(14,107,79,.30)}
.wc .amt{font:800 34px/1 var(--f);letter-spacing:-.8px;margin:6px 0 14px}
.wc .sm{color:rgba(255,255,255,.68)}

/* queue banner */
.qb{border-radius:22px;padding:20px;background:var(--b050);box-shadow:inset 0 0 0 2px var(--b200)}
.qb h4{font:800 19px/1.25 var(--f);color:var(--b800);letter-spacing:-.2px;max-width:210px}
.cta{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:14px;
     background:var(--b600);color:#fff;font:800 15px/1 var(--f);box-shadow:0 6px 16px rgba(14,107,79,.28)}

/* slot */
.slot{border-radius:18px;padding:12px 15px;background:var(--surf);box-shadow:inset 0 0 0 2px var(--line);
      display:flex;align-items:center;gap:11px}
.slot .d{width:38px;height:38px;border-radius:50%;background:var(--sunken);flex:none;
         display:grid;place-items:center;color:var(--t3);font:800 15px/1 var(--f)}
.slot .tm{font:800 17px/1 var(--f);letter-spacing:-.3px}
.slot .ms{font:500 12px/1.3 var(--f);color:var(--t2);margin-top:3px}
.slot .bd{margin-left:auto;height:28px;padding:0 11px;border-radius:999px;background:var(--b050);
          color:var(--b600);font:800 12px/28px var(--f);white-space:nowrap}
.slot.al{box-shadow:inset 0 0 0 2px var(--a300)}
.slot.al .bd{background:var(--a100);color:var(--a700)}
.slot.al .d{background:var(--a100);color:var(--a600)}
.slot.sel{background:var(--b050);box-shadow:inset 0 0 0 2.5px var(--b600)}
.slot.sel .d{background:var(--b600);color:#fff}
.slot.sel .bd{background:var(--b600);color:#fff}
.slot.full{opacity:.55}
.slot.full .bd{background:#FCE7E5;color:var(--bad)}

/* food card */
.fc{width:190px;flex:none;border-radius:18px;background:var(--surf);overflow:hidden;
    box-shadow:0 1px 3px rgba(26,29,28,.06)}
.fc .ph{aspect-ratio:4/3;position:relative;background:var(--b050)}
.fc .ph img{width:100%;height:100%;object-fit:cover}
.fc .b{padding:11px}
.fc .n{font:700 14px/1.25 var(--f);letter-spacing:-.2px}
.fc .m{display:flex;align-items:center;gap:6px;margin-top:5px}
.fc .p{font:800 14px/1 var(--f)}
.fc .r{font:700 11px/1 var(--f);color:var(--a600)}
.tag{position:absolute;left:7px;top:7px;height:22px;padding:0 8px;border-radius:999px;
     background:var(--a500);color:#fff;font:800 10px/22px var(--f)}
.tag.f{background:var(--b600)}
.hrt{position:absolute;right:7px;top:7px;width:30px;height:30px;border-radius:50%;
     background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--bad);font-size:14px}
.add{position:absolute;right:10px;bottom:-16px;width:40px;height:40px;border-radius:50%;
     background:var(--b600);color:#fff;display:grid;place-items:center;font:800 20px/1 var(--f);
     box-shadow:0 5px 14px rgba(14,107,79,.34)}
.rail{display:flex;gap:12px}

/* steps / timeline */
.tl{display:flex;gap:11px;align-items:flex-start}
.tl .o{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
       box-shadow:inset 0 0 0 2px var(--line);color:var(--t3);font:800 15px/1 var(--f)}
.tl .d{background:var(--b300);color:var(--b900);box-shadow:none}
.tl .n{background:var(--b600);color:#fff;box-shadow:none}

/* big stat */
.stat{background:var(--surf);border-radius:22px;padding:26px;box-shadow:0 1px 3px rgba(26,29,28,.05)}
.stat .k{font:700 11px/1 var(--f);letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.stat .v{font:800 44px/1 var(--f);letter-spacing:-1.6px;margin-top:10px}
.stat .d{font:500 14px/1.4 var(--f);color:var(--t2);margin-top:8px}
.tiles{display:grid;gap:20px}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tiles.c2{grid-template-columns:repeat(2,1fr)}

/* console mock */
.console{background:var(--bg);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(10,25,20,.16);
        display:flex;flex-direction:column}
.chrome{height:40px;background:var(--surf);border-bottom:1px solid var(--line);
        display:flex;align-items:center;gap:9px;padding:0 16px;flex:none}
.chrome .d{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.chrome .u{flex:1;height:22px;border-radius:999px;background:var(--sunken);
           font:700 10px/22px var(--f);color:var(--t3);padding:0 11px}
.cbody{flex:1;padding:22px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.cnav{display:flex;gap:3px;background:var(--surf);padding:3px;border-radius:12px;box-shadow:0 1px 3px rgba(26,29,28,.07)}
.cnav b{font:800 12px/1 var(--f);padding:9px 13px;border-radius:9px;color:var(--t2)}
.cnav b.on{background:var(--b050);color:var(--b700)}
.panel{background:var(--surf);border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(26,29,28,.05)}
.pt{font:800 16px/1.2 var(--f);letter-spacing:-.2px}
.ps{font:500 12px/1.3 var(--f);color:var(--t2);margin-top:3px}

/* kitchen columns */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kbc{background:var(--sunken);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kbc h5{font:800 11px/1 var(--f);color:var(--t2);display:flex;justify-content:space-between;
        padding:2px 4px 6px}
.kbc h5 span{background:var(--surf);border-radius:999px;padding:3px 7px;font-size:10px;
             box-shadow:0 1px 2px rgba(26,29,28,.08)}
.kcard{background:var(--surf);border-radius:13px;padding:11px;box-shadow:0 1px 3px rgba(26,29,28,.07)}
.kcard .i{font:800 13px/1 var(--f)}
.kcard .d{font:700 11px/1.3 var(--f);margin-top:5px;color:var(--t1)}
.kcard .s{margin-top:6px;display:inline-block;background:var(--sunken);border-radius:999px;
          padding:3px 8px;font:800 10px/1 var(--f);color:var(--t2)}
.kcard .go{margin-top:8px;height:28px;border-radius:9px;background:var(--b050);color:var(--b700);
           font:800 11px/28px var(--f);text-align:center}
.kcard.rdy .go{background:var(--a500);color:#fff}

/* bars + donut */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.bars .b{flex:1;background:var(--b300);border-radius:5px 5px 2px 2px}
.bars .b.hi{background:var(--b600)}
.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}
.donut::after{content:'';position:absolute;inset:14px;background:var(--surf);border-radius:50%}
.donut b{position:relative;z-index:1;font:800 27px/1 var(--f);letter-spacing:-1px}
.meter{height:9px;border-radius:9px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:var(--b500)}
.meter i.o{background:var(--a500)}

/* QR */
.qr{width:190px;height:190px;background:#fff;border-radius:18px;padding:14px;display:grid;
    place-items:center;box-shadow:0 2px 16px rgba(26,29,28,.08)}
.qr svg{width:100%;height:100%}

/* slide layouts */
.two{display:grid;grid-template-columns:1fr auto;gap:70px;align-items:center;flex:1}
.two-l{display:grid;grid-template-columns:auto 1fr;gap:70px;align-items:center;flex:1}
.center{display:grid;place-items:center;text-align:center;flex:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.feat{background:var(--surf);border-radius:24px;padding:30px;box-shadow:0 1px 3px rgba(26,29,28,.05)}
.dark .feat{background:rgba(255,255,255,.07);box-shadow:none}
.feat .ic{width:52px;height:52px;border-radius:16px;background:var(--b050);color:var(--b600);
          display:grid;place-items:center;font-size:23px;margin-bottom:18px}
.dark .feat .ic{background:rgba(107,212,174,.20);color:var(--b300)}
.feat h4{font:800 21px/1.25 var(--f);letter-spacing:-.3px;margin-bottom:9px}
.feat p{font:500 15px/1.55 var(--f);color:var(--t2)}
.dark .feat p{color:rgba(255,255,255,.68)}
.cap{font:700 12px/1 var(--f);letter-spacing:1.4px;color:var(--t3);text-transform:uppercase}
</style>
</head>
<body>
<div id="err" style="position:fixed;z-index:999;top:0;left:0;right:0;background:#FCE7E5;
  color:#8E201B;font:600 13px/1.5 monospace;padding:12px;display:none;white-space:pre-wrap"></div>
<div id="stage"></div>
<div class="hint">← → Space · F fullscreen</div>

<script>
onerror=(m,s,l,c,e)=>{const d=document.getElementById('err');d.style.display='block';
  d.textContent='АЛДАА '+(e&&e.stack||m);};
const C={b900:'#052E22',b800:'#07422F',b700:'#0A5540',b600:'#0E6B4F',b300:'#6BD4AE',b200:'#A9E9D0',b050:'#EEFBF5',
 a500:'#FF7A29',a600:'#E86A16',a100:'#FFEDE1',a300:'#FFB781',a700:'#B84A0C',bg:'#FAF9F6',surf:'#fff',sunken:'#F3F1EC',
 line:'#E6E3DC',t1:'#1A1D1C',t2:'#5C6563',t3:'#8E9795',ok:'#12855F',warn:'#E8A317',bad:'#D0342C'};
const P=n=>n.toLocaleString('en-US')+'₮';
const IMG=(id,w=600)=>`https://images.unsplash.com/${id}?w=${w}&q=80&auto=format&fit=crop`;
const DISH=[['Бууз',4500,4.6,'photo-1563245372-f21724e3856d','🔥 Эрэлт ихтэй'],
 ['Тахианы цуйван',5500,4.8,'photo-1569718212165-3a8278d5f624','🔥 Эрэлт ихтэй'],
 ['Ногоотой хуурга',4800,4.4,'photo-1546069901-ba9599a7e63c',''],
 ['Гурилтай шөл',4000,4.2,'photo-1547592166-23ac45744acd',''],
 ['Жимсний салат',2500,4.5,'photo-1512621776951-a57141f2eefd','Шинэ'],
 ['Сүү',1500,4.3,'photo-1550583724-b2692b85b150','']];

/* deterministic QR-looking matrix (stylised — not a scannable code) */
function qrSVG(n=21){
  let h=99,s='';
  const rnd=()=>{h=(h*1103515245+12345)&0x7fffffff;return h/0x7fffffff;};
  const inFinder=(r,c)=>(r<7&&c<7)||(r<7&&c>n-8)||(r>n-8&&c<7);
  const finder=(r,c)=>
    `<rect x="${c}" y="${r}" width="7" height="7" fill="${C.b900}"/>`+
    `<rect x="${c+1}" y="${r+1}" width="5" height="5" fill="#fff"/>`+
    `<rect x="${c+2}" y="${r+2}" width="3" height="3" fill="${C.b900}"/>`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(inFinder(r,c))continue;
    if(rnd()>.52) s+=`<rect x="${c}" y="${r}" width="1" height="1" fill="${C.b900}"/>`;
  }
  s+=finder(0,0)+finder(0,n-7)+finder(n-7,0);
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${s}</svg>`;
}
const slot=(tm,ms,bd,cls='')=>`<div class="slot ${cls}"><div class="d">${cls==='sel'?'✓':cls==='al'?'!':''}</div>
  <div style="min-width:0"><div class="tm">${tm}</div><div class="ms">${ms}</div></div>
  <div class="bd">${bd}</div></div>`;
const navB=(on=0)=>`<div class="pnav">${['Нүүр','Меню','Захиалга','Wallet','Профайл']
  .map((n,i)=>`<div class="${i===on?'on':''}"><div class="pill" style="opacity:${i===on?1:0}"></div>
  <i class="${i===on?'':'sm'}" style="${i===on?'':'background:none;border:2px solid currentColor'}"></i>
  <span>${n}</span></div>`).join('')}</div>`;
const sbar=()=>`<div class="sbar"><span>11:38</span><span>▮▮▮ ጁ ▰</span></div>`;
const foodCard=d=>`<div class="fc"><div class="ph"><img src="${IMG(d[3],420)}" alt="">
  ${d[4]?`<span class="tag ${d[4]==='Шинэ'?'f':''}">${d[4]}</span>`:''}
  <span class="hrt">♥</span><span class="add">+</span></div>
  <div class="b"><div class="n">${d[0]}</div>
  <div class="m"><span class="p">${P(d[1])}</span><span class="r">★ ${d[2].toFixed(1)}</span></div></div></div>`;

const PHONE_HOME=`<div class="phone">${sbar()}
 <div class="pbody">
  <div><div class="lbl">9А АНГИ</div><div class="ttl" style="margin-top:3px">Сайн уу, Бат 👋</div></div>
  <div class="wc"><div class="lbl" style="color:rgba(255,255,255,.65)">МИНИЙ WALLET</div>
   <div class="amt">25,500₮</div>
   <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="sm">Бат-Эрдэнэ · •••• 4421</div>
    <div style="height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);
         font:800 12px/30px var(--f)">+ Цэнэглэх</div></div></div>
  <div class="qb"><h4>Өнөөдөр дараалал хүлээхгүй</h4>
   <div class="sml" style="margin-top:4px">Авах цагаа урьдчилж сонгоорой.</div>
   <div style="margin-top:14px"><span class="cta">Цагаа сонгох →</span></div></div>
  <div style="background:var(--a100);border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:center">
   <div style="width:30px;height:30px;border-radius:50%;background:var(--a500);color:#fff;
        display:grid;place-items:center;font-size:15px">🔥</div>
   <div style="min-width:0"><div style="font:800 14px/1.2 var(--f)">Тахианы цуйван</div>
   <div class="sml" style="color:var(--a700);font-size:12px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis">Өнөөдөр хамгийн их захиалсан</div></div></div>
  <div style="display:flex;gap:7px;overflow:hidden">
   ${['Бүгд','Үндсэн хоол','Хөнгөн','Ундаа'].map((c,i)=>`<span style="height:34px;padding:0 14px;
     border-radius:999px;display:inline-flex;align-items:center;font:700 12px/1 var(--f);flex:none;
     background:${i===0?C.b600:'#fff'};color:${i===0?'#fff':C.t2};
     box-shadow:${i===0?'none':'inset 0 0 0 1.5px '+C.line}">${c}</span>`).join('')}</div>
  <div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">
    <span style="font:800 17px/1 var(--f)">Өнөөдрийн меню</span>
    <span style="font:800 12px/1 var(--f);color:var(--b600)">Бүгд →</span></div>
   <div class="rail">${DISH.slice(0,3).map(foodCard).join('')}</div></div>
 </div>${navB(0)}</div>`;

const PHONE_QUEUE=`<div class="phone">${sbar()}
 <div class="pbody">
  <div><div class="ttl">Хоолоо авах цаг</div>
   <div class="sml" style="margin-top:5px;max-width:270px">Хүмүүсийг нэг дор цуглуулахгүйгээр
    өөрийн цагаа сонгоорой.</div></div>
  <div style="display:flex;flex-direction:column;gap:10px">
   ${slot('11:30–11:40','Захиалгын тоо · 8','8 сул')}
   ${slot('11:40–11:50','Захиалгын тоо · 10','⚠ 6 сул үлдлээ','al')}
   ${slot('11:50–12:00','Захиалгын тоо · 12','⚠ 4 сул үлдлээ','al')}
   ${slot('12:00–12:10','Таны авах ээлж','8 сул','sel')}

const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>`<section class="slide ${s.cls}" data-i="${i}">${s.inner}
 <div class="bar"><span>Amjilt Canteen</span>
 <span class="dots">${S.map((_,j)=>`<i data-j="${j}" class="${j===i?'cur':''}"></i>`).join('')}</span>
 <span>${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div></section>`).join('');

const sl=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  sl.forEach((s,j)=>s.classList.toggle('on',j===i));
  document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('cur',j===i));
  location.hash='#'+(i+1);
  document.body.classList.add('hide');
}
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit);
addEventListener('hashchange',()=>{
  const n=Math.min(S.length,Math.max(1,+location.hash.slice(1)||1))-1;
  if(n!==i)show(n);
});
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
  if(e.key==='Home')show(0);
  if(e.key==='End')show(S.length-1);
  if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
});
addEventListener('click',e=>{
  const d=e.target.closest('[data-j]');
  if(d)return show(+d.dataset.j);
  show(e.clientX<innerWidth*0.28?i-1:i+1);
});
fit();
show(location.hash?Math.min(S.length,Math.max(1,+location.hash.slice(1)||1))-1:0);
</script>
</body>
</html>
